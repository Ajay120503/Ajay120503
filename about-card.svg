<svg width="700" height="230" viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
      * { font-family: 'JetBrains Mono', monospace; }

      .card-bg   { fill: #161b22; }
      .left-bg   { fill: #0d1117; }
      .border    { stroke: #30363d; stroke-width: 1; fill: none; }
      .dot-r     { fill: #ff5f57; }
      .dot-y     { fill: #febc2e; }
      .dot-g     { fill: #28c840; }
      .titlebar  { fill: #1c2128; }
      .tab-text  { fill: #8b949e; font-size: 11px; }
      .avatar-bg { fill: #7B61FF; }
      .avatar-txt{ fill: #ffffff; font-size: 38px; font-weight: 700; }
      .name-txt  { fill: #e6edf3; font-size: 14px; font-weight: 700; }
      .role-txt  { fill: #8b949e; font-size: 11px; }
      .badge-bg  { fill: #7B61FF22; stroke: #7B61FF55; stroke-width: 1; rx: 20; }
      .badge-txt { fill: #7B61FF; font-size: 10px; }
      .key       { fill: #7B61FF; font-size: 12px; font-weight: 500; }
      .arr       { fill: #30363d; font-size: 12px; }
      .val       { fill: #e6edf3; font-size: 12px; }
      .muted     { fill: #8b949e; font-size: 11px; }
      .divider   { stroke: #30363d; stroke-width: 0.5; }
      .bar-bg    { fill: #21262d; }
      .bar-mern  { fill: #7B61FF; }
      .bar-py    { fill: #3776AB; }
      .bar-sec   { fill: #DC143C; }
      .bar-label { fill: #8b949e; font-size: 10px; }
      .bar-val   { fill: #8b949e; font-size: 10px; }

      @media (prefers-color-scheme: light) {
        .card-bg   { fill: #f6f8fa; }
        .left-bg   { fill: #ffffff; }
        .titlebar  { fill: #eaeef2; }
        .tab-text  { fill: #57606a; }
        .name-txt  { fill: #24292f; }
        .role-txt  { fill: #57606a; }
        .key       { fill: #6e40c9; }
        .arr       { fill: #8c959f; }
        .val       { fill: #24292f; }
        .muted     { fill: #57606a; }
        .divider   { stroke: #d0d7de; }
        .bar-bg    { fill: #eaeef2; }
        .border    { stroke: #d0d7de; }
        .badge-bg  { fill: #6e40c922; stroke: #6e40c944; }
        .badge-txt { fill: #6e40c9; }
        .bar-label { fill: #57606a; }
        .bar-val   { fill: #57606a; }
      }
    </style>
    <clipPath id="roundCard"><rect width="700" height="230" rx="10"/></clipPath>
    <clipPath id="avatar"><circle cx="100" cy="108" r="38"/></clipPath>
  </defs>

  <!-- Card background -->
  <g clip-path="url(#roundCard)">
    <rect class="card-bg" width="700" height="230"/>

    <!-- Titlebar -->
    <rect class="titlebar" width="700" height="32"/>
    <circle class="dot-r" cx="18" cy="16" r="5"/>
    <circle class="dot-y" cx="36" cy="16" r="5"/>
    <circle class="dot-g" cx="54" cy="16" r="5"/>
    <text class="tab-text" x="80" y="21">ajay@dev  ~  profile.sh</text>

    <!-- Left panel -->
    <rect class="left-bg" x="0" y="32" width="200" height="198"/>
    <line class="divider" x1="200" y1="32" x2="200" y2="230"/>

    <!-- Avatar circle -->
    <circle class="avatar-bg" cx="100" cy="105" r="40"/>
    <text class="avatar-txt" x="100" y="118" text-anchor="middle">A</text>

    <!-- Name + role -->
    <text class="name-txt" x="100" y="158" text-anchor="middle">Ajay</text>
    <text class="role-txt" x="100" y="173" text-anchor="middle">Full-Stack Developer</text>

    <!-- Badge -->
    <rect class="badge-bg" x="42" y="182" width="116" height="18" rx="9"/>
    <text class="badge-txt" x="100" y="194" text-anchor="middle">✦ Open to Work</text>

    <!-- Right panel content -->
    <!-- Row 1 -->
    <text class="key"    x="220" y="62">name</text>
    <text class="arr"    x="268" y="62">→</text>
    <text class="val"    x="286" y="62">Ajay</text>

    <!-- Row 2 -->
    <text class="key"    x="220" y="80">location</text>
    <text class="arr"    x="284" y="80">→</text>
    <text class="val"    x="302" y="80">India 🇮🇳</text>

    <!-- Row 3 -->
    <text class="key"    x="220" y="98">role</text>
    <text class="arr"    x="268" y="98">→</text>
    <text class="val"    x="286" y="98">MERN Stack Developer</text>

    <!-- Row 4 -->
    <text class="key"    x="220" y="116">stack</text>
    <text class="arr"    x="268" y="116">→</text>
    <text class="val"    x="286" y="116">MongoDB · Express · React · Node.js</text>

    <!-- Row 5 -->
    <text class="key"    x="220" y="134">building</text>
    <text class="arr"    x="284" y="134">→</text>
    <text class="val"    x="302" y="134">Kaksha LMS · Snippet Store · RTSPScan</text>

    <!-- Row 6 -->
    <text class="key"    x="220" y="152">interests</text>
    <text class="arr"    x="284" y="152">→</text>
    <text class="val"    x="302" y="152">EdTech · Security Tools · Dev Utilities</text>

    <!-- Divider -->
    <line class="divider" x1="220" y1="162" x2="690" y2="162"/>

    <!-- Progress bars -->
    <!-- MERN -->
    <text class="bar-label" x="220" y="178">MERN</text>
    <rect class="bar-bg"  x="264" y="170" width="380" height="6" rx="3"/>
    <rect class="bar-mern" x="264" y="170" width="349" height="6" rx="3"/>
    <text class="bar-val" x="652" y="178">92%</text>

    <!-- Python -->
    <text class="bar-label" x="220" y="196">Python</text>
    <rect class="bar-bg"  x="264" y="188" width="380" height="6" rx="3"/>
    <rect class="bar-py"  x="264" y="188" width="266" height="6" rx="3"/>
    <text class="bar-val" x="652" y="196">70%</text>

    <!-- Security -->
    <text class="bar-label" x="220" y="214">Security</text>
    <rect class="bar-bg"  x="264" y="206" width="380" height="6" rx="3"/>
    <rect class="bar-sec" x="264" y="206" width="285" height="6" rx="3"/>
    <text class="bar-val" x="652" y="214">75%</text>

    <!-- Border -->
    <rect class="border" width="699" height="229" rx="10"/>
  </g>
</svg>
